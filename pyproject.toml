[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-lab"
version = "0.1.0"
description = "A measurable training and LLM serving laboratory for constrained hardware"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "regex>=2024.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.11", "httpx>=0.27", "tiktoken>=0.7"]
plots = ["matplotlib>=3.8"]
gpu = ["torch>=2.2"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["pyarrow>=18,<19"]
demo = ["gradio>=6", "huggingface_hub>=1.0"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
